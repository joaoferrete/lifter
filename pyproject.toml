[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lifter-cli"
version = "0.4.2"
description = "Interactive terminal client for Hevy workouts: analytics, goal tracking, Google Fit sync, and an AI coach"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "João Ferrete" }]
keywords = ["hevy", "workout", "fitness", "gym", "cli", "ai-coach", "google-fit", "strength-training"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.0",
    "google-genai>=1.0",
    "google-auth-oauthlib>=1.0",
    "google-auth>=2.0",
    "anthropic>=0.40",
    "openai>=1.30",
    "requests>=2.31",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "questionary>=2.0",
]

[project.urls]
Homepage = "https://github.com/joaoferrete/lifter"
Repository = "https://github.com/joaoferrete/lifter"
Issues = "https://github.com/joaoferrete/lifter/issues"

[project.scripts]
lifter = "cli:main"

[tool.setuptools]
py-modules = ["cli", "config", "profile_mgr", "debug_log", "i18n", "paths", "render_cache"]

[tool.setuptools.package-data]
locales = ["*.json"]

[tool.setuptools.packages.find]
exclude = ["tests*", ".venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
exclude = ["tests/"]

[tool.ruff.lint]
ignore = ["E501", "E402", "F401"]
