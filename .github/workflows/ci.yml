name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Unit & integration tests ──────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Run tests with coverage
        env:
          HEVY_API_KEY: "test-key"
          GEMINI_API_KEY: "test-key"
          ANTHROPIC_API_KEY: "test-key"
          AI_PROVIDER: "gemini"
          DB_PATH: "/tmp/test-lifter.db"
        run: pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false   # don't block CI if codecov is down

  # ── Linting & formatting ──────────────────────────────────────────────────
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Pinned so CI lint results can't change without a code change.
      # Rule configuration lives in pyproject.toml — no flags here.
      - name: Install ruff
        run: pip install ruff==0.15.15

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  # ── Type checking ─────────────────────────────────────────────────────────
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Run mypy
        run: mypy .

  # ── Packaging check ───────────────────────────────────────────────────────
  build:
    name: Build & verify distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify wheel contains locale files
        run: |
          unzip -l dist/*.whl | grep -q "locales/en.json" || (echo "ERROR: locales/en.json missing from wheel" && exit 1)
          unzip -l dist/*.whl | grep -q "locales/pt_BR.json" || (echo "ERROR: locales/pt_BR.json missing from wheel" && exit 1)

      - name: Verify sdist contains no sensitive files
        run: |
          tar tzf dist/*.tar.gz | grep -E '\.env$|\.db$|fit_credentials' && (echo "ERROR: sensitive files leaked into sdist" && exit 1) || true

      - name: twine check
        run: twine check dist/*

  # ── Dependency vulnerability scan ────────────────────────────────────────
  security-deps:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit project dependencies for known CVEs
        run: pip-audit --desc --format=columns .

  # ── Secret hygiene checks ─────────────────────────────────────────────────
  security-secrets:
    name: Secret hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for secret scanning

      - name: Check .env.example contains no real secrets
        run: |
          python3 - <<'EOF'
          import re, sys
          content = open(".env.example").read()
          checks = [
              (r"HEVY_API_KEY=[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}", "Real Hevy API key"),
              (r"GEMINI_API_KEY=AIza",                                  "Real Gemini API key"),
              (r"ANTHROPIC_API_KEY=sk-ant-[a-zA-Z0-9]",               "Real Anthropic API key"),
          ]
          found = [msg for pat, msg in checks if re.search(pat, content)]
          if found:
              print("SECRET LEAK DETECTED in .env.example:", found)
              sys.exit(1)
          print("OK — no real secrets in .env.example")
          EOF

      - name: Check sensitive files are not git-tracked
        run: |
          TRACKED=$(git ls-files | grep -E '^(\.env|.*fit_token.*|.*fit_credentials.*|.*\.db)$' || true)
          if [ -n "$TRACKED" ]; then
            echo "SENSITIVE FILE TRACKED BY GIT:"
            echo "$TRACKED"
            exit 1
          fi
          echo "OK — no sensitive files tracked"

      - name: Scan git history for secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@v3.95.9
        with:
          path: ./
          base: ${{ github.event.before || 'HEAD~1' }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true   # informational; don't block merge
