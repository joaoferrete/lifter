[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lifter-cli"
version = "0.4.2"
description = "Interactive terminal client for Hevy workouts: analytics, goal tracking, Google Fit sync, and an AI coach"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "João Ferrete" }]
keywords = ["hevy", "workout", "fitness", "gym", "cli", "ai-coach", "google-fit", "strength-training"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.0",
    "google-genai>=1.0",
    "google-auth-oauthlib>=1.0",
    "google-auth>=2.0",
    "anthropic>=0.40",
    "openai>=1.30",
    "requests>=2.31",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "questionary>=2.0",
]

[project.optional-dependencies]
# Amazon Bedrock via boto3/AWS credentials (the bearer-token path needs no extra).
bedrock = ["anthropic[bedrock]>=0.40", "boto3>=1.34"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/joaoferrete/lifter"
Repository = "https://github.com/joaoferrete/lifter"
Issues = "https://github.com/joaoferrete/lifter/issues"
Changelog = "https://github.com/joaoferrete/lifter/blob/main/CHANGELOG.md"

[project.scripts]
lifter = "cli:main"

[tool.setuptools]
py-modules = ["cli", "config", "profile_mgr", "debug_log", "i18n", "paths", "render_cache", "http_retry"]

[tool.setuptools.package-data]
locales = ["*.json"]

[tool.setuptools.packages.find]
exclude = ["tests*", ".venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
    "PLC", # pylint conventions
    "PLE", # pylint errors
    "PLW", # pylint warnings
]
ignore = [
    # Long lines in string literals; ruff format enforces the 120 limit for code.
    "E501",
    # Lazy in-function imports are deliberate: they keep CLI startup fast and
    # break import cycles. Prefer top-level imports where neither applies.
    "PLC0415",
    # The TUI intentionally uses typographic unicode (·, —, ✓) in output strings.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# config.py and debug_log.py are documented mutable-singleton modules.
"config.py" = ["PLW0603"]
"debug_log.py" = ["PLW0603"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["^\\.venv/", "^build/", "^dist/"]

[[tool.mypy.overrides]]
module = [
    "questionary.*",
    "google.*",
    "google_auth_oauthlib.*",
    "pandas.*",
    "boto3.*",
    "botocore.*",
]
ignore_missing_imports = true

# Strictness ratchet: modules refactored to full typing stay fully typed.
# New modules are born strict — add them here in the same PR.
[[tool.mypy.overrides]]
module = [
    "db.*",
    "paths",
    "config",
    "render_cache",
    "debug_log",
    "i18n",
    "analytics.*",
    "hevy.*",
    "fit.*",
    "http_retry",
    "ai.*",
]
disallow_untyped_defs = true
