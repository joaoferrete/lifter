[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lifter"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.0",
    "google-genai>=1.0",
    "google-auth-oauthlib>=1.0",
    "google-auth>=2.0",
    "anthropic>=0.40",
    "openai>=1.30",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "questionary>=2.0",
]

[project.scripts]
lifter = "cli:main"

[tool.setuptools]
py-modules = ["cli", "config", "profile_mgr", "debug_log"]

[tool.setuptools.packages.find]
exclude = ["tests*", ".venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
exclude = ["tests/"]

[tool.ruff.lint]
ignore = ["E501", "E402", "F401"]
